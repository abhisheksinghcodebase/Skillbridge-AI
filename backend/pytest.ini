[pytest]
# Pytest configuration for SkillBridge AI backend

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio configuration
asyncio_mode = auto

# Coverage configuration
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov-report=term-missing
    --cov-report=html:coverage_html
    --cov-report=xml

# Test markers
markers =
    unit: Unit tests for service layer
    integration: Integration tests for API endpoints
    database: Database-specific tests (constraints, transactions)
    performance: Performance tests for critical endpoints
    slow: Slow-running tests

# Test paths
testpaths = tests

# Minimum coverage fail threshold (optional)
# Uncomment to enforce minimum coverage
# --cov-fail-under=80

# Ignore patterns
norecursedirs = .git .tox venv __pycache__ *.egg-info

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
